name: Update README & Philosophy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # يتم تشغيله تلقائياً كل 6 ساعات أو يدوياً

permissions:
  contents: write # صلاحية كتابة الـ Git لرفع التغييرات للمستودع

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main autonomous script
        run: |
          python main.py

      - name: Commit and push changes to README and logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md trading_history.json memory_bank.json 2>/dev/null || true
          git commit -m "chore: auto-update live telemetry and trading history [skip ci]" || echo "No changes to commit"
          git push
