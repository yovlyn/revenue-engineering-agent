name: Update README & Philosophy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai || echo "Google GenAI optional"
          pip install -r requirements.txt || echo "No requirements.txt found"

      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_readme.py

      - name: Run Unit Tests
        run: python -m unittest discover tests || echo "Tests skipped"

      - name: Commit and Push Direct to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md memory_bank.json trading_history.json || true
          git commit -m "🤖 Auto-update telemetry and README [skip ci]" || echo "No changes to commit"
          git push origin main
