name: Full Evaluation & README Update

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Backtest Engine (Strategy SMA + RSI)
        run: python backtest_engine.py

      - name: Run Main System
        run: python main.py

      - name: List files (debug)
        run: ls -la

      - name: Run README Updater
        run: python update_readme.py

      - name: Pull latest changes before commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No rebase needed"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update backtest performance and dynamic README"
          branch: main
