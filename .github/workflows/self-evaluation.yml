name: Self-Evaluation Workflow

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Main System
        run: python main.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update: Logs and Secure Audit Trail"
          # هنا أضفنا secure_audit_log.jsonl ليقوم البوت برفعه دائماً
          file_pattern: evaluation_log.txt README.md secure_audit_log.jsonl
